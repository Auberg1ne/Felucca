<!doctype html><meta charset="utf-8"><title>Load optional playtest demo</title><h1>Optional demo save</h1><p>This writes a demo project and eight synthetic user samples to this playtest origin's browser storage. Existing saved data requires explicit confirmation. Keep valuable data elsewhere.</p><button id="backup">Download existing saved sectors</button> <button id="load">Load demo</button><p id="status"></p><a href="web/emu/index.html">Open simulator without changing saves</a><script type="module">
import {readSavedSectors} from './web/emu/startup.js';
const key='felucca-emu-flash',status=document.querySelector('#status');
document.querySelector('#backup').onclick=()=>{const old=localStorage.getItem(key);if(!old){status.textContent='No saved sectors on this origin.';return;}const u=URL.createObjectURL(new Blob([old],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='coffee-grains-saved-sectors.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
document.querySelector('#load').onclick=async()=>{try{if(localStorage.getItem(key)&&!confirm('Replace saved data on this dedicated playtest origin? Download it first if needed.'))return;const res=await fetch('./demo-sectors.json');if(!res.ok)throw Error('Demo download failed');const text=await res.text();readSavedSectors({getItem:()=>text},key);localStorage.setItem(key,text);location.href='./web/emu/index.html';}catch(e){status.textContent=e.message;}};
</script>
